global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "portfolio-website"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://13.204.88.176
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: "blackbox-exporter"
    static_configs:
      - targets:
          - blackbox:9115
